openapi: 3.1.0
info:
  title: Self-Hosted Spotify API
  version: 1.0.0
  description: >-
    The frontend owns the audio player and transient playback state. This API
    provides playlist and track metadata and resolves track IDs to audio bytes.
    The initial audio implementation serves local files. The browser's native
    audio player handles play, pause, seeking, volume, buffering, shuffle,
    repeat, and queue behavior.
servers:
  - url: /api/v1
paths:
  /playlists:
    get:
      operationId: listPlaylists
      summary: List available playlists
      tags: [Playlists]
      responses:
        "200":
          description: Playlists available to the current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistCollection"
        default:
          $ref: "#/components/responses/Problem"

  /playlists/{playlistId}/tracks:
    get:
      operationId: listPlaylistTracks
      summary: List tracks in a playlist
      tags: [Playlists]
      parameters:
        - name: playlistId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tracks in playlist order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackCollection"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /tracks/{trackId}/audio:
    get:
      operationId: getTrackAudio
      summary: Get track audio
      description: >-
        Returns the audio for a track ID. The server resolves the track ID to
        its current audio source internally; clients must not provide file
        paths. This predictable URL can be used as the browser audio player's
        source and may be served by a separate media host in the future.
      tags: [Tracks]
      parameters:
        - name: trackId
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          required: false
          description: HTTP byte range requested by the browser for seeking.
          schema:
            type: string
      responses:
        "200":
          description: The complete audio representation as bytes.
          headers:
            Accept-Ranges:
              description: Indicates support for byte-range requests.
              schema:
                type: string
                example: bytes
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "206":
          description: The requested partial audio representation as bytes.
          headers:
            Accept-Ranges:
              description: Indicates support for byte-range requests.
              schema:
                type: string
                example: bytes
            Content-Range:
              description: Byte range returned and total representation size.
              schema:
                type: string
                example: bytes 0-1023/2048
          content:
            audio/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "416":
          description: The requested byte range cannot be satisfied.
          headers:
            Content-Range:
              description: Total representation size for an unsatisfiable range.
              schema:
                type: string
                example: bytes */2048
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  schemas:
    PlaylistCollection:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Playlist"
        total:
          type: integer
          minimum: 0

    Playlist:
      type: object
      additionalProperties: false
      required: [id, name, trackCount, durationSeconds]
      properties:
        id:
          type: string
        name:
          type: string
        trackCount:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        artworkUrl:
          type: [string, "null"]
          format: uri

    TrackCollection:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        total:
          type: integer
          minimum: 0

    Track:
      type: object
      additionalProperties: false
      required: [id, title, artist, durationSeconds, position]
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: [string, "null"]
        durationSeconds:
          type: integer
          minimum: 0
        position:
          type: integer
          minimum: 0
        artworkUrl:
          type: [string, "null"]
          format: uri

    Problem:
      type: object
      additionalProperties: true
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
